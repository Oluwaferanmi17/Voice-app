version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: silent-voice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: silentvoice
      POSTGRES_PASSWORD: silentvoice_dev
      POSTGRES_DB: silent_voice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silentvoice -d silent_voice"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: silent-voice-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: